name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the development runtime, needed by the corpus tooling for node:sqlite. 20 is the
        # oldest runtime the published library supports, and is tested because consumers such as
        # EmailEngine run it.
        node-version: [20.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      # The committed fixture tier of the structural benchmark. Small, deterministic, and mandatory
      # on every pull request. It exits non zero when any message that had visible body text going
      # in produced no output, or when content was hidden without a structural anchor. The private
      # corpus tier is a pre-release job and cannot run here, because the corpus is private email.
      - run: node dist/cli/main.js benchmark --dir test/fixtures

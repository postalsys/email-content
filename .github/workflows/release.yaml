name: release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      # Authentication is npm trusted publishing over OIDC: no token, and id-token: write above.
      #
      # Provenance is deliberately NOT requested. Sigstore rejects attestations built from a private
      # source repository ("Only public source repositories are supported when publishing with
      # provenance", npm error E422), and this repository is private. Add --provenance here if and
      # when the repository is made public.
      - run: npm publish
